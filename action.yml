name: "Asana Sync"
description: "Sync Github PRs to Asana Tasks"
author: "Sam Macbeth"
inputs:
  ASANA_ACCESS_TOKEN:
    required: true
    description: "Access token for Asana API calls"
  ASANA_WORKSPACE_ID:
    required: true
    description: "ID of your Asana workspace"
  ASANA_PROJECT_ID:
    required: true
    description: "Project ID where issues should be created in Asana"
  move_to_section_id:
    required: false
    description: "If set: move the task to this section after creation"
  USER_MAP:
    required: false
    description: "JSON string mapping Github user IDs to Asana Email addresses"
  SKIPPED_USERS:
    required: false
    description: "Comma separated list of users who should not be assigned tasks"
  NO_AUTOCLOSE_PROJECTS:
    required: false
    description: "Comma separated list of project GIDs where we should not automatically close tasks"
  GITHUB_PAT:
    required: false
    description: "Github PAT used for fetching the user map from a private repo."
  ASSIGN_PR_AUTHOR:
    required: false
    description: "If 'true', the PR task will be assigned to the Github PR author."
  INCLUDE_ASSIGNEES:
    required: false
    description: "If 'true', review subtasks are created for the union of the PR's assignees and its requested reviewers, instead of for requested reviewers only."
  REVIEW_TASKS_AS_APPROVALS:
    required: false
    description: "If 'true', new review subtasks are created as Asana approval tasks, and their approval status is set from the Github review: Approved, Changes Requested, or back to pending. Requires an Asana plan that supports approvals. Review subtasks created before this was enabled are never converted."
outputs:
  task_url:
    description: URL of created/updated PR review task
  result:
    description: "Will be one of: created, updated"
runs:
  using: "node24"
  main: "dist/index.js"
