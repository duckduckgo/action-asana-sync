version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # @types/node must match the Node runtime the action runs on
      # (action.yml `runs.using: node24`, .nvmrc). Bump its major by hand
      # together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # nock 15 is ESM-only, which Jest (CommonJS mode) cannot load without
      # moving the whole test suite to native ESM. Stay on 14.x until then.
      - dependency-name: "nock"
        update-types: ["version-update:semver-major"]
