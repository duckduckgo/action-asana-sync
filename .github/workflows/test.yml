name: "build-test"
on: # rebuild any PRs
  pull_request:
  push:
    branches:
      - main
      - "releases/*"

jobs:
  build: # make sure build/ci work properly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set Node.js 24.x
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
      - run: |
          npm install
      - run: |
          npm run all
